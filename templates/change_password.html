<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password - VMS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="dashboard-container">

    <aside class="sidebar">

        <div class="logo">
            <h2>VMS</h2>
            <p>Visitor Management</p>
        </div>

        <nav>
            <a href="{{ url_for('dashboard') }}">🏠 Dashboard</a>
            <a href="{{ url_for('visitors') }}">👤 Visitors</a>
            <a href="{{ url_for('visit_requests') }}">📋 Visit Requests</a>
            <a href="{{ url_for('gate_passes') }}">🎫 Gate Passes</a>
            <a href="{{ url_for('visit_logs') }}">📝 Visitor Logs</a>
            <a href="/reports">📊 Reports</a>
            <a href="{{ url_for('settings') }}" class="active">⚙️ Settings</a>
        </nav>

        <a href="/" class="logout">🚪 Logout</a>

    </aside>

    <main class="main-content">

        <div class="page-header">
            <div>
                <h1>Change Password</h1>
                <p>Update your account password</p>
            </div>
        </div>

        <div class="table-container">

            <h2>Change Password</h2>

            <form method="POST">

                <p>
                    <label>Current Password</label><br>
                    <input type="password"
                           name="current_password"
                           required>
                </p>

                <p>
                    <label>New Password</label><br>
                    <input type="password"
                           name="new_password"
                           required>
                </p>

                <p>
                    <label>Confirm New Password</label><br>
                    <input type="password"
                           name="confirm_password"
                           required>
                </p>

                <button type="submit" class="add-btn">
                    Change Password
                </button>

            </form>

            <br>

            <a href="{{ url_for('settings') }}" class="view-btn">
                ← Back to Settings
            </a>

        </div>

    </main>

</div>

</body>
</html>
