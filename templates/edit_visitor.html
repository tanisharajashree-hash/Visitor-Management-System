<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Visitor - Visitor Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Edit Visitor</h1>
    <p>Update visitor details below</p>

    <form method="POST"
          action="{{ url_for('edit_visitor', visitor_id=visitor.visitor_id) }}">

        <label>Visitor Name</label>
        <input type="text"
               name="name"
               value="{{ visitor.name }}"
               required>

        <label>Phone Number</label>
        <input type="text"
               name="phone"
               value="{{ visitor.phone }}"
               required>

        <label>Email</label>
        <input type="email"
               name="email"
               value="{{ visitor.email }}"
               required>

        <label>Purpose of Visit</label>
        <input type="text"
               name="purpose"
               value="{{ visitor.purpose }}"
               required>

        <button type="submit">Update Visitor</button>

    </form>

    <br>

    <a href="{{ url_for('visitors') }}">← Back to Visitors</a>

</div>

</body>
</html>
