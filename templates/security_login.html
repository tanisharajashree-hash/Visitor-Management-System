<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Security Login - Visitor Management System</title>

<link rel="stylesheet" href="{{ url_for('static', filename='security_login.css') }}">

</head><body><div class="login-container">

    <div class="login-box">

        <h1>Visitor Management System</h1>

        <h2>Security Login</h2>

        <p>Login to access the Security Dashboard</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

        </form>

    </div>

</div>

</body>
</html>
